# Local Redis for the BullMQ queue (web + worker). The database is Neon; see README.
services:
  redis:
    image: redis:7-alpine
    # BullMQ must never lose keys to eviction.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
