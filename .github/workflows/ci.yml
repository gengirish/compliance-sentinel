name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Builds the production image (which smoke-tests `weasyprint --version`) and renders
  # the demo report to PDF inside it, so the WeasyPrint path is exercised on every push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: compliance-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render the demo report to PDF
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/app/reports" compliance-sentinel:ci node dist/cli/auditRun.js --demo
          test -s out/run-1.pdf
          head -c 5 out/run-1.pdf | grep -q '%PDF-'
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: out/run-1.pdf
