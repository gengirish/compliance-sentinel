name: Compliance Sentinel
description: Audit this repository against regulation text and comment on the pull request with file:line findings.
author: IntelliForge AI
branding:
  icon: shield
  color: blue

inputs:
  anthropic-api-key:
    description: Anthropic API key. Without it the offline keyword baseline runs, which checks only catalogue controls.
    required: false
    default: ""
  voyage-api-key:
    description: Voyage AI key for voyage-law-2 embeddings. Without it a local hash embedder is used.
    required: false
    default: ""
  rules:
    description: Comma-separated prefixes of the bundled rule files to audit against, e.g. "pci" or "pci,gdpr". Empty means all.
    required: false
    default: pci
  fail-on:
    description: Fail the job when a violation at or above this severity is found (critical, high, medium, low or none).
    required: false
    default: critical
  comment:
    description: Post or update a summary comment on the pull request.
    required: false
    default: "true"
  max-cost-usd:
    description: Stop calling the model once a run has spent this much.
    required: false
    default: "2"

outputs:
  summary-path:
    description: Path of the Markdown summary.
    value: ${{ steps.audit.outputs.summary-path }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install Compliance Sentinel
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile --prod=false
    - name: Audit
      id: audit
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        VOYAGE_API_KEY: ${{ inputs.voyage-api-key }}
        DEMO_RULES: ${{ inputs.rules }}
        MAX_RUN_COST_USD: ${{ inputs.max-cost-usd }}
        DATABASE_URL: ""
        PGLITE_DIR: ${{ runner.temp }}/sentinel-db
        REPORTS_DIR: ${{ runner.temp }}/sentinel-reports
        SCRAPE_EURLEX: "false"
      run: |
        summary="${RUNNER_TEMP}/sentinel-summary.md"
        set +e
        pnpm --silent audit:run --demo \
          --repo "$GITHUB_WORKSPACE" \
          --markdown "$summary" \
          --repo-web-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --fail-on "${{ inputs.fail-on }}"
        status=$?
        set -e
        echo "summary-path=$summary" >> "$GITHUB_OUTPUT"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compliance-sentinel-report
        path: ${{ runner.temp }}/sentinel-reports
        if-no-files-found: ignore
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.audit.outputs.summary-path != ''
      uses: actions/github-script@v7
      env:
        SUMMARY_PATH: ${{ steps.audit.outputs.summary-path }}
      with:
        script: |
          const fs = require("fs");
          if (!fs.existsSync(process.env.SUMMARY_PATH)) return;
          const body = fs.readFileSync(process.env.SUMMARY_PATH, "utf8");
          const marker = "<!-- compliance-sentinel-report -->";
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Apply fail-on
      if: steps.audit.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "Compliance Sentinel found violations at or above '${{ inputs.fail-on }}' (or the audit failed); see the summary."
        exit 1
